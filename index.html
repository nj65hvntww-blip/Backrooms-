let lkT=0;const lkMark=()=>{lkT=performance.now()};
document.addEventListener('pointerlockchange',lkMark);addEventListener('focus',lkMark);document.addEventListener('visibilitychange',lkMark);
let accTh=0,accPt=0;
addEventListener('mousemove',e=>{if(st!='play'||paused)return;if(performance.now()-lkT<150)return;const k=document.pointerLockElement===cv?.0022:e.buttons?.005:0;if(!k)return;
const dx=e.movementX,dy=e.movementY;if(!isFinite(dx)||!isFinite(dy))return;
const lim=unadj?3000:Math.max(700,Math.max(innerWidth,innerHeight)*.5);if(Math.abs(dx)>lim||Math.abs(dy)>lim)return;
accTh-=dx*sens*k;accPt-=dy*sens*k});
function applyLook(){if(st!='play'||paused){accTh=accPt=0;return}th+=accTh;pitch=Math.max(-1.45,Math.min(1.45,pitch+accPt));accTh=accPt=0;if(!isFinite(th))th=0;if(!isFinite(pitch))pitch=0}

async function getMic(){if(stream)return true;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false}})}catch(e){return false}hookMic();return true}
function hookMic(){if(an||!stream||!AC)return;const src=AC.createMediaStreamSource(stream);an=AC.createAnalyser();an.fftSize=1024;abuf=new Uint8Array(an.fftSize);src.connect(an)}

function jset(t){const r=joy.getBoundingClientRect(),R_=r.width/2;let dx=t.clientX-(r.left+R_),dy=t.clientY-(r.top+R_);const l=Math.hypot(dx,dy);if(l>R_){dx*=R_/l;dy*=R_/l}knob.style.transform='translate('+dx+'px,'+dy+'px)';const nx=dx/R_,ny=dy/R_;if(Math.hypot(nx,ny)<.18){jx=0;jy=0}else{jx=nx;jy=-ny}}
